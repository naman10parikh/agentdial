<text x="24" y="66" fill="#7fc492">$ <tspan fill="#f3f0e8">agentdial --help</tspan></text>
<text x="24" y="86" fill="#d8d3c8" xml:space="preserve">Usage: agentdial [options] [command]</text>
<text x="24" y="106" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="126" fill="#d8d3c8" xml:space="preserve">Dial your AI agent into every platform. One identity. Every channel.</text>
<text x="24" y="146" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="166" fill="#d8d3c8" xml:space="preserve">Options:</text>
<text x="24" y="186" fill="#d8d3c8" xml:space="preserve">  -V, --version                    output the version number</text>
<text x="24" y="206" fill="#d8d3c8" xml:space="preserve">  -h, --help                       display help for command</text>
<text x="24" y="226" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="246" fill="#d8d3c8" xml:space="preserve">Commands:</text>
<text x="24" y="266" fill="#d8d3c8" xml:space="preserve">  quickstart [options]             Zero to hero — API key to live agent in 90</text>
<text x="24" y="286" fill="#d8d3c8" xml:space="preserve">                                   seconds</text>
<text x="24" y="306" fill="#d8d3c8" xml:space="preserve">  setup [options]                  Interactive setup wizard — configure</text>
<text x="24" y="326" fill="#d8d3c8" xml:space="preserve">                                   identity and channels</text>
<text x="24" y="346" fill="#d8d3c8" xml:space="preserve">  channels                         Manage communication channels</text>
<text x="24" y="366" fill="#d8d3c8" xml:space="preserve">  voice                            Voice channel management (Twilio)</text>
<text x="24" y="386" fill="#d8d3c8" xml:space="preserve">  status [options]                 Show status of all channels and the gateway</text>
<text x="24" y="406" fill="#d8d3c8" xml:space="preserve">  test [options]                   Send a test message through the gateway</text>
<text x="24" y="426" fill="#d8d3c8" xml:space="preserve">  serve [options]                  Start the agentdial gateway server</text>
<text x="24" y="446" fill="#d8d3c8" xml:space="preserve">  recipes                          Per-platform setup recipes with friction</text>
<text x="24" y="466" fill="#d8d3c8" xml:space="preserve">                                   tiers and verification</text>
<text x="24" y="486" fill="#d8d3c8" xml:space="preserve">  login [options]                  Authenticate with AgentDial via Clerk OAuth</text>
<text x="24" y="506" fill="#d8d3c8" xml:space="preserve">  logout                           Clear stored authentication credentials</text>
<text x="24" y="526" fill="#d8d3c8" xml:space="preserve">  whoami [options]                 Show current authentication status</text>
<text x="24" y="546" fill="#d8d3c8" xml:space="preserve">  mcp-serve                        Start as an MCP server for Claude Code</text>
<text x="24" y="566" fill="#d8d3c8" xml:space="preserve">                                   integration</text>
<text x="24" y="586" fill="#d8d3c8" xml:space="preserve">…</text>
</svg>
