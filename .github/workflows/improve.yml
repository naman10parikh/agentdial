name: improve

# AgentDial's self-improvement loop (dsip.json). It runs daily and on demand, needs no secret and
# only reads the repository: it runs the evals, compares them with eval/baseline.json, checks for
# outdated dependencies and writes a proposal to the job summary and an artifact. It never pushes or
# merges; a person reviews the proposal and merges any change through a pull request.

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Run the improvement loop
        run: npm run improve
      - name: Show the proposal
        if: always()
        run: cat logs/improve/latest.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: improvement-proposal
          path: logs/improve/
          if-no-files-found: ignore
